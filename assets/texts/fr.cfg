help.g1=Auto-activé si une manette est présente au lancement ; sinon Config. Générale ->
help.g2=Contrôle : Manette. La souris et le clavier restent utilisables.
help.g3=D-pad : Haut Menu / Bas Monstres / Gauche PNJ / Droite Joueurs
help.g4=   (rappuyer de la même façon = Standard).
help.g5=L3 Mode souris (stick gauche = curseur)  R3 Mode caméra
help.g6=Standard : stick gauche déplacement (avant=direction, G/D strafe),
help.g7=   stick droit rotation G/D, H/B inclinaison caméra.
help.g8=   A attaquer le plus proche  Y s'asseoir  X attaque auto  B ramasser
help.g9=Modes de ciblage : B le plus proche, stick droit choisir par direction,
help.g10=   A agir (attaquer / parler), X menu contextuel, Y suivant/effacer.
help.g11=Emplacements rapides : maintenir L2/R2 (rangée 1) ou L1/R1 (rangée 2), puis
help.g12=   un bouton face = l'emplacement de ce bloc (A/B/X/Y = 1/2/3/4).
help.g13=Mode menu : stick droit déplace le focus, A valider, Y fermer, X retour,
help.g14=   stick gauche déplace la fenêtre (ou défile), L1/R1 onglets, L2/R2 fenêtres.
help.g15=Équipement : focus un emplacement porté, A = retirer.
help.g16=Texte : clavier à l'écran (D-pad déplacer, A touche, OK valider).
help.g17=Boîte de quantité : D-pad +/-, A OK, Y annuler.
help.g18=Start (Menu) : ouvrir/fermer le menu ESC dans n'importe quel mode.
help.g19=Back (View/Share) : basculer le Cam Lock (caméra suiveuse) on/off ;
help.g20=   le statut s'affiche comme Cam Lock / Cam Free dans la barre de mode.
help.g21=Axe du stick inversé / rotation trop rapide ? ESC -> Config. Manette.
help.g22=Vibration : bascules de vibration par événement dans Config. Manette.
help.g23=Xbox / Steam Deck
help.g24=Boutons A/B/X/Y ; gâchettes LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Boutons Cross/Circle/Square/Triangle = A/B/X/Y ici.
help.g27=Le pavé tactile pilote le curseur dans tous les modes (clic = LMB).
help.g28=Nintendo Switch
help.g29=Boutons B/A/Y/X correspondent à A/B/X/Y ici ; ZL/ZR = L2/R2.

