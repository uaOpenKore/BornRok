login.top=ยินดีต้อนรับสู่ BornRok\nเว็บไซต์ของเรา: bornrok.com\nเกม MMORPG คลาสสิก
login.bottom=หากต้องการสร้างบัญชี โปรดอ่านคำแนะนำที่ปุ่มด้านล่าง และเพิ่มคำต่อท้ายเพื่อสร้างบัญชี!
login.howto=1. คิดชื่อล็อกอิน (อย่างน้อย 5 ตัวอักษร) เช่น: LOGIN\n2. พิมพ์ชื่อล็อกอินที่ต้องการในช่อง "ID"\n3. การเลือกเพศ:\n- บัญชีชายให้เติม "_m"\n- บัญชีหญิงให้เติม "_f"\nตัวอย่าง: login_m หรือ login_f\n4. คิดรหัสผ่าน (อย่างน้อย 5 ตัวอักษร) แล้วพิมพ์ในช่อง "Password"\n5. เมื่อเข้าสู่ระบบครั้งต่อไป อย่าเติม "_m"/"_f" ให้กรอกเฉพาะชื่อล็อกอิน\n6. อีเมลเริ่มต้น: a@a.com\n7. สามารถเปลี่ยนรหัสผ่านภายหลังได้ที่เว็บไซต์ของเรา
