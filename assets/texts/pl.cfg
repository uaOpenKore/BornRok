# --- Help content ---
help.v1=Smugi światła (Świat. wolum.: Promienie) nie są widoczne, gdy
help.v2=włączone jest HDR lub skalowanie renderu (FSR1 / SSAA). Wyłącz oba
help.v3=w Ustawieniach obrazu, aby zobaczyć promienie boże.
help.v4=Interpolacja
help.v5=Interp. anim. / efektów płynnie przenika klatki sprite'ów (wył. = klasyczny).
