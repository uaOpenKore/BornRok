help.g1=Ativado automaticamente se um controle estiver presente ao iniciar; senão Config. Geral ->
help.g2=Controle: Gamepad. Mouse e teclado continuam funcionando.
help.g3=D-pad: Cima Menu / Baixo Monstros / Esquerda NPCs / Direita Jogadores
help.g4=   (pressione da mesma forma novamente = Padrão).
help.g5=L3 Modo mouse (analógico esquerdo = cursor)  R3 Modo câmera
help.g6=Padrão: analógico esquerdo move (frente=direção, E/D deslocamento lateral),
help.g7=   analógico direito gira E/D, inclina câmera C/B.
help.g8=   A ataca o mais próximo  Y sentar  X ataque automático  B pegar
help.g9=Modos de alvo: B mais próximo, analógico direito escolhe por direção,
help.g10=   A agir (atacar / conversar), X menu de contexto, Y próximo/limpar.
help.g11=Atalhos rápidos: segure L2/R2 (linha 1) ou L1/R1 (linha 2), depois um
help.g12=   botão de face = espaço daquele bloco (A/B/X/Y = 1/2/3/4).
help.g13=Modo menu: analógico direito move o foco, A seleciona, Y fecha, X voltar,
help.g14=   analógico esquerdo move a janela (ou rola), L1/R1 abas, L2/R2 janelas.
help.g15=Equipamento: foque um espaço equipado, A = remover.
help.g16=Texto: teclado na tela (D-pad move, A tecla, OK confirma).
help.g17=Diálogo de quantidade: D-pad +/-, A OK, Y cancelar.
help.g18=Start (Menu): abre/fecha o menu ESC em qualquer modo.
help.g19=Back (View/Share): alterna a Trava de Câmera (câmera de seguimento) ligado/desligado;
help.g20=   o status aparece como Câmera Travada / Câmera Livre na barra de modo.
help.g21=Eixo do analógico invertido / vira rápido demais? ESC -> Config. do GamePad.
help.g22=Vibração: alternância de vibração por evento em Config. do GamePad.
help.g23=Xbox / Steam Deck
help.g24=Botões de face A/B/X/Y; ombro LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Botões de face Cross/Circle/Square/Triangle = A/B/X/Y aqui.
help.g27=O touchpad move o cursor em qualquer modo (clique = LMB).
help.g28=Nintendo Switch
help.g29=Botões de face B/A/Y/X correspondem a A/B/X/Y aqui; ZL/ZR = L2/R2.

