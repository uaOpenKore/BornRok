login.howto=1. Scegli un login (almeno 5 caratteri), per esempio: LOGIN\n2. Scrivi il login desiderato nel campo "ID"\n3. Per scegliere il sesso:\n- Per un account maschile aggiungi "_m"\n- Per un account femminile aggiungi "_f"\nEsempio: login_m o login_f\n4. Scegli una password (almeno 5 caratteri). Scrivila nel campo "Password"\n5. Per rientrare NON scrivere il suffisso "_m"/"_f", inserisci solo il tuo login\n6. Email predefinita: a@a.com\n7. La password può essere cambiata in seguito sul nostro sito
