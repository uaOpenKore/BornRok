help.t6=Pizzico (due dita): zoom (Standard e Telecamera).
help.t7=Modalità (barra inferiore)
help.t8=Standard: trascina per camminare in quella direzione; tocca per interagire.
help.t9=Telecamera: trascina per ruotare e inclinare liberamente la telecamera.
help.t10=Pad: leva sinistra cammina, leva destra ruota la telecamera.
help.t11=CamLock (pulsante sopra Standard)
help.t12=Blocca la telecamera alla rotazione del personaggio.
help.t13=Standard/Telecamera mantengono il tuo angolo; Pad si posiziona dietro il personaggio (la sua vista); la leva destra del Pad ruota ancora e torna dietro al rilascio.
