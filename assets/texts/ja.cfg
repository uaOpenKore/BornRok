help.k15=Alt+1..0 / Num 1..0   ホットバー枠
help.k16=Tab  ミニマップ    Enter  チャットにフォーカス
help.k17=Esc  メニュー/ウィンドウを閉じる
help.k18=LMB  移動/攻撃    RMB  カメラ回転
help.k19=Wheel  ズーム
help.k20=/sit /stand, /w <name> <text>
help.g1=起動時にパッドが接続されていれば自動オン。それ以外は 一般設定 ->
help.g2=操作方式: ゲームパッド。マウス・キーボードも引き続き使用可能。
help.g3=D-pad: 上 メニュー / 下 モンスター / 左 NPC / 右 プレイヤー
help.g4=   (同じ操作をもう一度 = スタンダードに戻る)。
help.g5=L3 マウスモード (左スティック=カーソル)  R3 カメラモード
help.g6=スタンダード: 左スティックで移動 (前進=向いている方向、左右ストレイフ)、
help.g7=   右スティック 左右で旋回、上下でカメラ傾き。
help.g8=   A 最寄りを攻撃  Y 座る  X 自動攻撃  B 拾う
help.g9=ターゲットモード: B 最寄りを選択、右スティックで方向選択、
help.g10=   A 実行 (攻撃/会話)、X コンテキストメニュー、Y 次/解除。
help.g11=クイックスロット: L2/R2 (1段目) または L1/R1 (2段目) を押しながら
help.g12=   フェイスボタンでそのブロックの枠を選択 (A/B/X/Y = 1/2/3/4)。
help.g13=メニューモード: 右スティックでフォーカス移動、A 選択、Y 閉じる、X 戻る、
help.g14=   左スティックでウィンドウ移動 (またはスクロール)、L1/R1 タブ切替、L2/R2 ウィンドウ切替。
help.g15=装備: 装備中の枠にフォーカスし、A で外す。
help.g16=テキスト入力: 画面キーボード (D-pad で移動、A でキー入力、OK で確定)。
help.g17=数量ダイアログ: D-pad で +/-、A OK、Y キャンセル。
help.g18=Start (メニュー): どのモードでもESCメニューを開閉。
help.g19=Back (View/Share): カメラ固定 (追従カメラ) をオン/オフ切替;
help.g20=   状態はモードストリップに Cam Lock / Cam Free として表示されます。
help.g21=スティックの軸が逆/旋回が速すぎる場合は ESC -> ゲームパッド設定 へ。
help.g22=振動: イベントごとの振動オン/オフはゲームパッド設定で切替可能。
help.g23=Xbox / Steam Deck
help.g24=フェイスボタン A/B/X/Y; ショルダー LB/RB (L1/R1)、LT/RT (L2/R2)。
help.g25=PlayStation 4
help.g26=フェイスボタン Cross/Circle/Square/Triangle = ここでの A/B/X/Y。
help.g27=タッチパッドでどのモードでもカーソル操作 (クリック = LMB)。
help.g28=Nintendo Switch
help.g29=フェイスボタン B/A/Y/X がここでの A/B/X/Y に対応; ZL/ZR = L2/R2。

