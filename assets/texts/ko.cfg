help.g1=게임 시작 시 패드가 연결되어 있으면 자동으로 켜짐; 아니면 일반 설정 ->
help.g2=조작: 게임패드. 마우스와 키보드도 계속 사용할 수 있습니다.
help.g3=D-pad: 위 메뉴 / 아래 몬스터 / 왼쪽 NPC / 오른쪽 플레이어
help.g4=   (같은 방식으로 다시 누르면 기본 모드로 전환).
help.g5=L3 마우스 모드 (왼쪽 스틱 = 커서)  R3 카메라 모드
help.g6=기본: 왼쪽 스틱으로 이동 (전진=바라보는 방향, 좌우=옆걸음),
help.g7=   오른쪽 스틱 좌우 회전, 상하 카메라 기울기.
help.g8=   A 가까운 대상 공격  Y 앉기  X 자동공격  B 줍기
help.g9=대상 모드: B 가장 가까운 대상, 오른쪽 스틱 방향으로 선택,
help.g10=   A 행동 (공격 / 대화), X 상황 메뉴, Y 다음/해제.
help.g11=단축 슬롯: L2/R2(1행) 또는 L1/R1(2행)을 누른 채
help.g12=   방향 버튼을 누르면 해당 블록의 슬롯 사용 (A/B/X/Y = 1/2/3/4).
help.g13=메뉴 모드: 오른쪽 스틱으로 포커스 이동, A 선택, Y 닫기, X 뒤로,
help.g14=   왼쪽 스틱으로 창 이동 (또는 스크롤), L1/R1 탭, L2/R2 창 전환.
help.g15=장비: 착용 슬롯에 포커스, A = 해제.
help.g16=텍스트: 화면 키보드 (D-pad 이동, A 입력, OK 확정).
help.g17=수량 입력 창: D-pad +/-, A 확인, Y 취소.
help.g18=Start (메뉴): 어느 모드에서든 ESC 메뉴를 열고 닫습니다.
help.g19=Back (View/Share): 카메라 고정(추적 카메라) 켜기/끄기 전환;
help.g20=   상태는 모드 표시줄에 카메라 고정 / 카메라 자유로 표시됩니다.
help.g21=스틱 축이 반대이거나 회전이 너무 빠르다면? ESC -> 게임패드 설정.
help.g22=진동: 게임패드 설정에서 이벤트별 진동을 켜고 끌 수 있습니다.
help.g23=Xbox / Steam Deck
