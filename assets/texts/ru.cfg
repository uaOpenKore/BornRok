help.k15=Alt+1..0 / Num 1..0   Слоты панели
help.k16=Tab  Миникарта    Enter  Фокус чата
help.k17=Esc  Меню / закрыть окно
help.k18=ЛКМ  Идти / атака    ПКМ  Вращать камеру
