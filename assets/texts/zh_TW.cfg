help.k20=/sit /stand, /w <名稱> <內容>
help.g1=啟動時若偵測到手把則自動開啟；否則請至一般設定 ->
help.g2=控制：手把。滑鼠與鍵盤仍可正常使用。
help.g3=D-pad：上 選單／下 怪物／左 NPC／右 玩家
help.g4=（以相同方式再按一次 = 回到標準模式）。
help.g5=L3 滑鼠模式（左搖桿 = 游標）  R3 鏡頭模式
help.g6=標準模式：左搖桿移動（前=面向方向，左右為平移），
help.g7=右搖桿左右轉向，上下傾斜鏡頭。
help.g8=A 攻擊最近目標  Y 坐下  X 自動攻擊  B 拾取
help.g9=目標模式：B 最近目標，右搖桿依方向選取，
help.g10=A 執行動作（攻擊／交談），X 開啟情境選單，Y 下一個／清除。
help.g11=快捷欄：按住 L2/R2（第一排）或 L1/R1（第二排），再按
help.g12=面板按鍵 = 該區塊的欄位（A/B/X/Y = 1/2/3/4）。
help.g13=選單模式：右搖桿移動焦點，A 選取，Y 關閉，X 返回，
help.g14=左搖桿移動視窗（或捲動），L1/R1 切換分頁，L2/R2 切換視窗。
help.g15=裝備：聚焦已穿戴欄位，A = 卸下。
help.g16=文字輸入：螢幕鍵盤（D-pad 移動，A 輸入按鍵，OK 確認輸入）。
help.g17=數量對話框：D-pad +/-，A 確定，Y 取消。
help.g18=Start（選單）：於任何模式下開啟／關閉 ESC 選單。
help.g19=Back（View/Share）：切換鏡頭鎖定（跟隨鏡頭）開／關；
help.g20=狀態會於模式列顯示為 Cam Lock / Cam Free。
help.g21=搖桿方向相反或轉向太快？請至 ESC -> 手把設定。
help.g22=震動：可於手把設定中依事件個別切換震動。
help.g23=Xbox / Steam Deck
help.g24=面板按鍵 A/B/X/Y；肩鍵 LB/RB（L1/R1）、LT/RT（L2/R2）。
help.g25=PlayStation 4
help.g26=面板按鍵 Cross/Circle/Square/Triangle 對應此處的 A/B/X/Y。
help.g27=觸控板可在任何模式下操控游標（點擊 = LMB）。
help.g28=Nintendo Switch
help.g29=面板按鍵 B/A/Y/X 對應此處的 A/B/X/Y；ZL/ZR = L2/R2。

