help.t12=Kamerayı karakterin dönüşüne kilitler.
help.t13=Standart/Kamera açını korur; Pad karakterin arkasına geçer (onun görüşü); Pad'in sağ çubuğu yine döndürür ve bırakınca arkaya döner.
