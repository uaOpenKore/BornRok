login.bottom=För att skapa ett konto, läs guiden via knappen nedan. Och lägg till suffixet för att skapa ditt konto!
login.howto=1. Hitta på ett användarnamn (minst 5 tecken), till exempel: LOGIN\n2. Skriv önskat användarnamn i fältet "ID"\n3. För att välja kön:\n- För ett manligt konto lägg till "_m"\n- För ett kvinnligt konto lägg till "_f"\nExempel: login_m eller login_f\n4. Hitta på ett lösenord (minst 5 tecken). Skriv det i fältet "Password"\n5. Vid nästa inloggning skriv INTE "_m"/"_f" - ange endast ditt användarnamn\n6. Standard-e-post: a@a.com\n7. Lösenordet kan ändras senare på vår webbplats
