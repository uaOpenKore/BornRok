# --- Help content ---
help.v1=Light shafts (Volum. Light: Rays) are NOT visible while
help.v2=HDR or Render Scale (FSR1 / SSAA) is enabled. Turn both
help.v3=off in Setup Video to see the god rays.
help.v4=Interpolation
help.v5=Interp. anim / fx smoothly tween sprite frames (off = classic).
help.k1=Alt+E    Inventory
help.k2=Alt+A    Stats
help.k3=Alt+Q    Equipment
help.k4=Alt+S    Skills
help.k5=Alt+U    Quest journal
help.k6=Alt+V    Basic info (cycle)
help.k7=Alt+W    Cart (merchant)
help.k8=Alt+M    Shortcut / bind list
help.k9=Alt+H    Friends
help.k10=Alt+Z    Party
help.k11=Alt+G    Guild
help.k12=Alt+B    Buying store
help.k13=Alt+C    Chat room
help.k14=Alt+X    Collapse / expand chat
help.k15=Alt+1..0 / Num 1..0   Hotbar slots
help.k16=Tab  Minimap    Enter  Focus chat
help.k17=Esc  Menu / close window
help.k18=LMB  Walk / attack    RMB  Rotate camera
help.k19=Wheel  Zoom
help.k20=/sit /stand, /w <name> <text>
help.g1=Auto-on if a pad is present at launch; else Setup General ->
help.g2=Control: Gamepad. Mouse + keyboard keep working.
help.g3=D-pad: Up Menu / Down Mobs / Left NPCs / Right Players
help.g4=   (press the same way again = Standard).
help.g5=L3 Mouse mode (left stick = cursor)  R3 Camera mode
help.g6=Standard: L-stick move (fwd=facing, L/R strafe),
help.g7=   R-stick L/R turn, U/D camera tilt.
help.g8=   A attack nearest  Y sit  X auto-atk  B pick up
help.g9=Target modes: B nearest, R-stick pick by direction,
help.g10=   A act (attack / talk), X context menu, Y next/clear.
help.g11=Quick-slots: hold L2/R2 (row 1) or L1/R1 (row 2), then a
help.g12=   face button = that block's slot (A/B/X/Y = 1/2/3/4).
help.g13=Menu mode: R-stick move focus, A select, Y close, X back,
help.g14=   L-stick move window (or scroll), L1/R1 tabs, L2/R2 windows.
help.g15=Equip: focus a worn slot, A = take off.
help.g16=Text: on-screen keyboard (D-pad move, A key, OK enter).
help.g17=Quantity dialog: D-pad +/-, A OK, Y cancel.
help.g18=Start (Menu): open/close the ESC menu in any mode.
help.g19=Back (View/Share): toggle Camera Lock (follow-cam) on/off;
help.g20=   status shows as Cam Lock / Cam Free in the mode strip.
help.g21=Stick axis reversed / turn too fast? ESC -> GamePad Setup.
help.g22=Vibration: per-event rumble toggles in GamePad Setup.
help.g23=Xbox / Steam Deck
help.g24=Face A/B/X/Y; shoulders LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Face Cross/Circle/Square/Triangle = A/B/X/Y here.
help.g27=Touchpad drives the cursor in any mode (click = LMB).
help.g28=Nintendo Switch
help.g29=Face B/A/Y/X map to A/B/X/Y here; ZL/ZR = L2/R2.

# --- Help: Touchscreen ---
help.t1=Auto-enabled on a touch device.
help.t2=Gestures
help.t3=Tap: walk, or interact with an NPC / mob / warp / item.
help.t4=Drag: the current mode's gesture.
help.t5=Long-press an object: context menu (right-click).
help.t6=Pinch (two fingers): zoom (Standard and Camera).
help.t7=Modes (bottom bar)
help.t8=Standard: drag to walk that way; tap to interact.
help.t9=Camera: drag to freely rotate and tilt the camera.
help.t10=Pad: left stick walks, right stick turns the camera.
help.t11=CamLock (button above Standard)
help.t12=Locks the camera to the character's turning.
help.t13=Standard/Camera keep your angle; Pad snaps behind (his view); Pad's right stick still rotates, returning behind on release.
help.t14=Text
help.t15=Tap a field to type (keyboard opens); tap the world to close it.

