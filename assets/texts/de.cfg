# --- Login / char select ---
login.top=Willkommen bei BornRok\nUnsere Website: bornrok.com\nEin klassisches MMORPG
login.bottom=Um ein Konto zu erstellen, lies die Anleitung über die Schaltfläche unten. Und füge das Postfix hinzu, um dein Konto zu erstellen!
login.howto=1. Denk dir einen Login aus (mindestens 5 Zeichen), zum Beispiel: LOGIN\n2. Trage deinen gewünschten Login im Feld "ID" ein\n3. Zur Wahl des Geschlechts:\n- Für ein männliches Konto füge "_m" hinzu\n- Für ein weibliches Konto füge "_f" hinzu\nBeispiel: login_m oder login_f\n4. Denk dir ein Passwort aus (mindestens 5 Zeichen). Trage es im Feld "Password" ein\n5. Beim erneuten Einloggen KEIN "_m"/"_f" anhängen - gib nur deinen Login ein\n6. Standard-E-Mail: a@a.com\n7. Das Passwort kann später auf unserer Website geändert werden
