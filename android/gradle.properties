org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Point these at your machine (or set VCPKG_ROOT / SDL3_ANDROID_JAVA in the environment):
vcpkgRoot=C:/vcpkg
# HOST shaderc.exe (from the desktop win-msvc build) so the Android build compiles the essl shaders.
# hostShaderc: host shaderc(.exe) to compile the essl (GLES) shaders (else the APK renders a grey
# screen -- see docs/android-build-km.md). Left UNSET: build.gradle auto-locates it from a desktop
# build inside this checkout (BornRok/build/win-msvc/.../tools/bgfx/shaderc.exe). Override here (or via
# env HOST_SHADERC) if your win-msvc build is elsewhere. The old hardcoded uAthena/Client path was
# removed -- it broke after the Client was split into its own BornRok repo.
# hostShaderc=C:/path/to/BornRok/build/win-msvc/vcpkg_installed/x64-windows-static/tools/bgfx/shaderc.exe
