help.g1=Se activează automat dacă un gamepad e prezent la pornire; altfel Configurare generală ->
help.g2=Control: Gamepad. Mouse-ul + tastatura continuă să funcționeze.
help.g3=D-pad: Sus Meniu / Jos Monștri / Stânga NPC-uri / Dreapta Jucători
help.g4=   (apasă din nou la fel = Standard).
help.g5=L3 Mod mouse (stick stânga = cursor)  R3 Mod cameră
help.g6=Standard: stick stânga mișcare (înainte=direcția privirii, stânga/dreapta pas lateral),
help.g7=   stick dreapta rotire stânga/dreapta, sus/jos înclinare cameră.
help.g8=   A atacă cel mai apropiat  Y stai jos  X auto-atac  B ridică
help.g9=Moduri țintă: B cel mai apropiat, stick dreapta alege după direcție,
help.g10=   A acțiune (atac / vorbește), X meniu contextual, Y următorul/golește.
help.g11=Sloturi rapide: ține apăsat L2/R2 (rândul 1) sau L1/R1 (rândul 2), apoi un
help.g12=   buton facial = slotul acelui bloc (A/B/X/Y = 1/2/3/4).
help.g13=Mod meniu: stick dreapta mută focalizarea, A selectează, Y închide, X înapoi,
help.g14=   stick stânga mută fereastra (sau derulează), L1/R1 taburi, L2/R2 ferestre.
help.g15=Echipament: focalizează un slot purtat, A = scoate.
help.g16=Text: tastatură pe ecran (D-pad mișcare, A tastă, OK enter).
help.g17=Dialog cantitate: D-pad +/-, A OK, Y anulează.
help.g18=Start (Meniu): deschide/închide meniul ESC în orice mod.
help.g19=Back (View/Share): comută Blocarea camerei (urmărire) pornit/oprit;
help.g20=   starea apare ca Cameră blocată / Cameră liberă în bara de mod.
help.g21=Axa stick-ului inversată / rotire prea rapidă? ESC -> Configurare GamePad.
help.g22=Vibrație: comutatoare de vibrație pe eveniment în Configurare GamePad.
help.g23=Xbox / Steam Deck
help.g24=Butoane faciale A/B/X/Y; umeri LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Butoanele faciale Cross/Circle/Square/Triangle = A/B/X/Y aici.
help.g27=Touchpad-ul controlează cursorul în orice mod (clic = LMB).
help.g28=Nintendo Switch
help.g29=Butoanele faciale B/A/Y/X corespund lui A/B/X/Y aici; ZL/ZR = L2/R2.

