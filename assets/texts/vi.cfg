help.g1=Tự bật nếu có tay cầm khi khởi động; nếu không thì vào Cài đặt chung ->
help.g2=Điều khiển: Tay cầm. Chuột + bàn phím vẫn hoạt động bình thường.
help.g3=D-pad: Lên Menu / Xuống Quái / Trái NPC / Phải Người chơi
help.g4=   (bấm lại theo cách tương tự = Tiêu chuẩn).
help.g5=L3 Chế độ chuột (cần trái = con trỏ)  R3 Chế độ camera
help.g6=Tiêu chuẩn: Cần trái di chuyển (tiến=hướng mặt, trái/phải lách),
help.g7=   Cần phải xoay trái/phải, nghiêng camera lên/xuống.
help.g8=   A tấn công gần nhất  Y ngồi  X tự động đánh  B nhặt đồ
help.g9=Chế độ mục tiêu: B gần nhất, cần phải chọn theo hướng,
help.g10=   A hành động (tấn công / nói chuyện), X menu ngữ cảnh, Y tiếp/xóa.
help.g11=Ô nhanh: giữ L2/R2 (hàng 1) hoặc L1/R1 (hàng 2), rồi bấm
help.g12=   nút mặt = ô của khối đó (A/B/X/Y = 1/2/3/4).
help.g13=Chế độ menu: cần phải di chuyển tiêu điểm, A chọn, Y đóng, X quay lại,
help.g14=   cần trái di chuyển cửa sổ (hoặc cuộn), L1/R1 chuyển tab, L2/R2 chuyển cửa sổ.
help.g15=Trang bị: chọn tiêu điểm ô đang mặc, A = tháo ra.
help.g16=Nhập chữ: bàn phím ảo trên màn hình (D-pad di chuyển, A chọn phím, OK xác nhận).
help.g17=Hộp thoại số lượng: D-pad +/-, A OK, Y hủy.
help.g18=Start (Menu): mở/đóng menu ESC ở bất kỳ chế độ nào.
help.g19=Back (View/Share): bật/tắt Khóa camera (theo dõi nhân vật);
help.g20=   trạng thái hiển thị là Cam Lock / Cam Free trên dải chế độ.
help.g21=Trục cần bị đảo ngược / xoay quá nhanh? ESC -> Cài đặt tay cầm.
help.g22=Rung: bật/tắt rung theo từng sự kiện trong Cài đặt tay cầm.
help.g23=Xbox / Steam Deck
help.g24=Nút mặt A/B/X/Y; nút vai LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Nút mặt Cross/Circle/Square/Triangle = A/B/X/Y ở đây.
help.g27=Touchpad điều khiển con trỏ ở mọi chế độ (bấm = LMB).
help.g28=Nintendo Switch
help.g29=Nút mặt B/A/Y/X tương ứng A/B/X/Y ở đây; ZL/ZR = L2/R2.

