help.g1=Αυτόματη ενεργοποίηση αν υπάρχει χειριστήριο κατά την εκκίνηση· αλλιώς Γενικές Ρυθμίσεις ->
help.g2=Έλεγχος: Gamepad. Το ποντίκι + πληκτρολόγιο συνεχίζουν να λειτουργούν.
help.g3=D-pad: Πάνω Μενού / Κάτω Τέρατα / Αριστερά NPC / Δεξιά Παίκτες
help.g4=   (πατήστε ξανά το ίδιο = Τυπικό).
help.g5=L3 Λειτουργία ποντικιού (αριστερός μοχλός = δρομέας)  R3 Λειτουργία κάμερας
help.g6=Τυπικό: αριστερός μοχλός κίνηση (εμπρός=κατεύθυνση, Α/Δ πλαγιοκίνηση),
help.g7=   δεξιός μοχλός Α/Δ στροφή, Π/Κ κλίση κάμερας.
help.g8=   A επίθεση στον πλησιέστερο  Y κάθισμα  X αυτόματη επίθεση  B μάζεμα
help.g9=Λειτουργίες στόχευσης: B πλησιέστερος, δεξιός μοχλός επιλογή κατά κατεύθυνση,
help.g10=   A ενέργεια (επίθεση / συνομιλία), X μενού επιλογών, Y επόμενο/καθαρισμός.
help.g11=Γρήγορες θέσεις: κρατήστε L2/R2 (σειρά 1) ή L1/R1 (σειρά 2), κατόπιν ένα
help.g12=   κουμπί όψης = η θέση αυτής της ομάδας (A/B/X/Y = 1/2/3/4).
help.g13=Λειτουργία μενού: δεξιός μοχλός μετακίνηση εστίασης, A επιλογή, Y κλείσιμο, X πίσω,
help.g14=   αριστερός μοχλός μετακίνηση παραθύρου (ή κύλιση), L1/R1 καρτέλες, L2/R2 παράθυρα.
help.g15=Εξοπλισμός: εστιάστε σε μια φορεμένη θέση, A = αφαίρεση.
help.g16=Κείμενο: πληκτρολόγιο οθόνης (D-pad μετακίνηση, A πλήκτρο, OK εισαγωγή).
help.g17=Διάλογος ποσότητας: D-pad +/-, A OK, Y ακύρωση.
help.g18=Start (Μενού): άνοιγμα/κλείσιμο του μενού ESC σε οποιαδήποτε λειτουργία.
help.g19=Back (View/Share): εναλλαγή Κλειδώματος Κάμερας (ακολουθία) ενεργό/ανενεργό·
