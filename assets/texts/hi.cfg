login.top=BornRok में आपका स्वागत है\nहमारी वेबसाइट: bornrok.com\nएक क्लासिक MMORPG
login.bottom=खाता बनाने के लिए, नीचे दिए बटन से निर्देश पढ़ें। और खाता बनाने के लिए पोस्टफ़िक्स जोड़ें!
