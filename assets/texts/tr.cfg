help.g1=Başlangıçta kol takılıysa otomatik açılır; değilse Genel Ayarlar ->
help.g2=Kontrol: Oyun Kolu. Fare + klavye çalışmaya devam eder.
help.g3=D-pad: Yukarı Menü / Aşağı Canavarlar / Sol NPC'ler / Sağ Oyuncular
help.g4=   (aynı şekilde tekrar basmak = Standart).
help.g5=L3 Fare modu (sol çubuk = imleç)  R3 Kamera modu
help.g6=Standart: L-çubuk hareket (ileri=yön, S/S yana kayma),
help.g7=   R-çubuk S/S dönüş, Y/A kamera eğimi.
help.g8=   A en yakına saldır  Y otur  X otomatik saldırı  B al
help.g9=Hedef modları: B en yakın, R-çubuk yönle seçim,
help.g10=   A eylem (saldır / konuş), X bağlam menüsü, Y sonraki/temizle.
help.g11=Hızlı yuvalar: L2/R2 (1. sıra) veya L1/R1 (2. sıra) basılı tut, sonra
help.g12=   bir yüz tuşu = o bloğun yuvası (A/B/X/Y = 1/2/3/4).
help.g13=Menü modu: R-çubuk odağı taşır, A seç, Y kapat, X geri,
help.g14=   L-çubuk pencereyi taşır (veya kaydırır), L1/R1 sekmeler, L2/R2 pencereler.
help.g15=Ekipman: takılı bir yuvaya odaklan, A = çıkar.
help.g16=Metin: ekran klavyesi (D-pad hareket, A tuş, OK gir).
help.g17=Miktar penceresi: D-pad +/-, A Tamam, Y iptal.
help.g18=Start (Menü): herhangi bir modda ESC menüsünü aç/kapat.
help.g19=Back (View/Share): Kamera Kilidini (takip kamerası) aç/kapat;
help.g20=   durum, mod çubuğunda Kam. Kilit / Kam. Serbest olarak gösterilir.
help.g21=Çubuk ekseni ters mi / dönüş çok mu hızlı? ESC -> Oyun Kolu Ayarları.
help.g22=Titreşim: Oyun Kolu Ayarları'nda olay başına titreşim aç/kapat.
help.g23=Xbox / Steam Deck
help.g24=Yüz A/B/X/Y; omuz LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Yüz Cross/Circle/Square/Triangle = burada A/B/X/Y.
help.g27=Dokunmatik yüzey her modda imleci sürer (tıklama = LMB).
help.g28=Nintendo Switch
help.g29=Yüz B/A/Y/X burada A/B/X/Y'ye karşılık gelir; ZL/ZR = L2/R2.

