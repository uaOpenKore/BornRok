login.howto=1. Choisissez un identifiant (au moins 5 caractères), par exemple : LOGIN\n2. Saisissez l'identifiant souhaité dans le champ "ID"\n3. Pour choisir le sexe :\n- Pour un compte masculin, ajoutez "_m"\n- Pour un compte féminin, ajoutez "_f"\nExemple : login_m ou login_f\n4. Choisissez un mot de passe (au moins 5 caractères). Saisissez-le dans le champ "Password"\n5. Pour vous reconnecter, n'ajoutez PAS le suffixe "_m"/"_f" - entrez seulement votre identifiant\n6. Email par défaut : a@a.com\n7. Le mot de passe peut être changé plus tard sur notre site
