login.top=Καλώς ήρθατε στο BornRok\nΙστοσελίδα μας: bornrok.com\nΈνα κλασικό MMORPG
login.bottom=Για να δημιουργήσετε λογαριασμό, διαβάστε τον οδηγό από το κουμπί παρακάτω. Και προσθέστε το επίθημα για να δημιουργήσετε τον λογαριασμό σας!
login.howto=1. Σκέψου ένα login (τουλάχιστον 5 χαρακτήρες), για παράδειγμα: LOGIN\n2. Γράψε το login που θέλεις στο πεδίο "ID"\n3. Για να επιλέξεις φύλο:\n- Για αντρικό λογαριασμό πρόσθεσε "_m"\n- Για γυναικείο λογαριασμό πρόσθεσε "_f"\nΠαράδειγμα: login_m ή login_f\n4. Σκέψου έναν κωδικό (τουλάχιστον 5 χαρακτήρες). Γράψε τον στο πεδίο "Password"\n5. Στην επόμενη σύνδεση ΜΗΝ γράφεις "_m"/"_f", βάλε μόνο το login σου\n6. Προεπιλεγμένο email: a@a.com\n7. Ο κωδικός πρόσβασης μπορεί να αλλάξει αργότερα στην ιστοσελίδα μας
