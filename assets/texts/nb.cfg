login.howto=1. Finn på et brukernavn (minst 5 tegn), for eksempel: LOGIN\n2. Skriv ønsket brukernavn i feltet "ID"\n3. For å velge kjønn:\n- For en mannlig konto legg til "_m"\n- For en kvinnelig konto legg til "_f"\nEksempel: login_m eller login_f\n4. Finn på et passord (minst 5 tegn). Skriv det i feltet "Password"\n5. Ved neste innlogging skriv IKKE "_m"/"_f" - skriv bare brukernavnet\n6. Standard e-post: a@a.com\n7. Passordet kan endres senere på vår nettside
