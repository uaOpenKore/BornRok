help.k20=/sit /stand, /w <имя> <текст>
help.g1=Авто-вкл, если геймпад подключён при запуске; иначе Настройки Общее ->
help.g2=Управление: Геймпад. Мышь и клавиатура продолжают работать.
help.g3=Крестовина: Вверх Меню / Вниз Мобы / Влево НПЦ / Вправо Игроки
help.g4=   (нажать так же ещё раз = Стандарт).
help.g5=L3 Режим мыши (левый стик = курсор)  R3 Режим камеры
help.g6=Стандарт: левый стик — движение (вперёд=взгляд, влево/вправо стрейф),
help.g7=   правый стик влево/вправо — поворот, вверх/вниз — наклон камеры.
help.g8=   A атака ближнего  Y сесть  X автоатака  B поднять
help.g9=Режимы цели: B ближний, правый стик — выбор по направлению,
help.g10=   A действие (атака/разговор), X контекст-меню, Y след./сброс.
help.g11=Быстрые слоты: держи L2/R2 (ряд 1) или L1/R1 (ряд 2), затем
help.g12=   лицевая кнопка = слот блока (A/B/X/Y = 1/2/3/4).
help.g13=Режим меню: правый стик — фокус, A выбор, Y закрыть, X назад,
help.g14=   левый стик двигает окно (или скролл), L1/R1 вкладки, L2/R2 окна.
help.g15=Экип: наведи на надетый слот, A = снять.
help.g16=Текст: экранная клавиатура (крестовина — навигация, A клавиша, OK ввод).
help.g17=Диалог количества: крестовина +/-, A ОК, Y отмена.
help.g18=Start (Menu): открыть/закрыть меню ESC в любом режиме.
help.g19=Back (View/Share): вкл/выкл блокировку камеры (следящая);
help.g20=   статус — Камера закр./своб. в строке режимов.
help.g21=Ось стика инвертирована / слишком быстрый поворот? ESC -> Настройка геймпада.
help.g22=Вибрация: переключатели по событиям в «Настройка геймпада».
help.g23=Xbox / Steam Deck
help.g24=Лицевые A/B/X/Y; бамперы LB/RB (L1/R1), курки LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Крест/Круг/Квадрат/Треуг. = A/B/X/Y здесь.
help.g27=Тачпад управляет курсором в любом режиме (клик = ЛКМ).
help.g28=Nintendo Switch
help.g29=Лицевые B/A/Y/X = A/B/X/Y здесь; ZL/ZR = L2/R2.

