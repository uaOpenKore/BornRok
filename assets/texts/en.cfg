login.bottom=To create an account, read the guide via the button below. And add the postfix to create your account!
login.howto=1. Think up a login (at least 5 characters), for example: LOGIN\n2. Type your desired login in the "ID" field\n3. To choose a gender:\n- For a male account, add "_m"\n- For a female account, add "_f"\nExample: login_m or login_f\n4. Think up a password (at least 5 characters). Type it in the "Password" field\n5. When logging in again, do NOT add the "_m" / "_f" suffix - enter only your login\n6. Default email: a@a.com\n7. The password can be changed later on our website
