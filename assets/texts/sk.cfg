help.g10=   A konať (útok / rozhovor), X kontextové menu, Y ďalší/zrušiť.
help.g11=Rýchle sloty: podrž L2/R2 (riadok 1) alebo L1/R1 (riadok 2), potom
help.g12=   tlačidlo tváre = slot daného bloku (A/B/X/Y = 1/2/3/4).
