help.g1=Se activa automáticamente si hay un mando al iniciar; si no, ve a Config. General ->
help.g2=Control: Mando. El ratón y el teclado siguen funcionando.
help.g3=D-pad: Arriba Menú / Abajo Monstruos / Izquierda NPCs / Derecha Jugadores
help.g4=   (pulsar igual otra vez = Estándar).
help.g5=L3 Modo ratón (stick izq. = cursor)  R3 Modo cámara
help.g6=Estándar: stick izq. mueve (adel.=orientación, izq./der. desplaza),
help.g7=   stick der. gira izq./der., arriba/abajo inclina la cámara.
help.g8=   A atacar más cercano  Y sentarse  X auto-ataque  B recoger
help.g9=Modos de objetivo: B más cercano, stick der. elige por dirección,
help.g10=   A actuar (atacar / hablar), X menú contextual, Y siguiente/limpiar.
help.g11=Ranuras rápidas: mantén L2/R2 (fila 1) o L1/R1 (fila 2), luego un
help.g12=   botón de acción = ranura de ese bloque (A/B/X/Y = 1/2/3/4).
help.g13=Modo menú: stick der. mueve el foco, A selecciona, Y cierra, X atrás,
help.g14=   stick izq. mueve la ventana (o desplaza), L1/R1 pestañas, L2/R2 ventanas.
help.g15=Equipo: enfoca una ranura equipada, A = quitar.
help.g16=Texto: teclado en pantalla (D-pad mueve, A tecla, OK confirmar).
help.g17=Diálogo de cantidad: D-pad +/-, A OK, Y cancelar.
help.g18=Start (Menú): abre/cierra el menú ESC en cualquier modo.
help.g19=Back (Ver/Compartir): activa/desactiva el Bloqueo de cámara (cámara de seguimiento);
help.g20=   el estado se muestra como Cám. Fija / Cám. Libre en la barra de modo.
help.g21=¿Ejes del stick invertidos o giro demasiado rápido? ESC -> Config. Mando.
help.g22=Vibración: activa/desactiva la vibración por evento en Config. Mando.
help.g23=Xbox / Steam Deck
help.g24=Botones A/B/X/Y; gatillos LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Botones Cross/Circle/Square/Triangle = A/B/X/Y aquí.
help.g27=El touchpad mueve el cursor en cualquier modo (clic = LMB).
help.g28=Nintendo Switch
help.g29=Botones B/A/Y/X equivalen a A/B/X/Y aquí; ZL/ZR = L2/R2.

