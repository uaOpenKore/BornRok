# --- Help content ---
help.v1=Промені (Об'ємне світло: Промені) НЕ видно, поки
help.v2=увімкнено HDR або масштаб рендеру (FSR1 / SSAA). Вимкни обидва
help.v3=у «Налаштування графіки», щоб побачити промені.
help.v4=Інтерполяція
help.v5=Інтерп. анім./ефектів плавно згладжує кадри (вимк. = класика).
help.k1=Alt+E    Інвентар
help.k2=Alt+A    Характеристики
help.k3=Alt+Q    Спорядження
help.k4=Alt+S    Навички
help.k5=Alt+U    Журнал завдань
help.k6=Alt+V    Осн. інфо (цикл)
help.k7=Alt+W    Візок (торговець)
help.k8=Alt+M    Список гарячих клавіш
help.k9=Alt+H    Друзі
help.k10=Alt+Z    Група
help.k11=Alt+G    Гільдія
help.k12=Alt+B    Скупка
help.k13=Alt+C    Чат-кімната
help.k14=Alt+X    Згорнути/розгорнути чат
help.k15=Alt+1..0 / Num 1..0   Слоти панелі
help.k16=Tab  Мінікарта    Enter  Фокус чату
help.k17=Esc  Меню / закрити вікно
help.k18=LMB  Йти / атака    RMB  Обертати камеру
help.k19=Wheel  Зум
help.k20=/sit /stand, /w <ім'я> <текст>
help.g1=Авто-увімк., якщо геймпад підключено при запуску; інакше Налаштування Загальне ->
help.g2=Керування: Геймпад. Миша й клавіатура продовжують працювати.
help.g3=D-pad: Вгору Меню / Вниз Моби / Ліворуч НПЦ / Праворуч Гравці
help.g4=   (натиснути так само ще раз = Стандарт).
help.g5=L3 Режим миші (лівий стик = курсор)  R3 Режим камери
help.g6=Стандарт: лівий стик — рух (вперед=погляд, вліво/вправо страйф),
help.g7=   правий стик вліво/вправо — поворот, вгору/вниз — нахил камери.
help.g8=   A атака найближчого  Y сісти  X автоатака  B підняти
help.g9=Режими цілі: B найближчий, правий стик — вибір за напрямком,
help.g10=   A дія (атака/розмова), X контекстне меню, Y наст./скинути.
help.g11=Швидкі слоти: тримай L2/R2 (ряд 1) або L1/R1 (ряд 2), потім
help.g12=   лицьова кнопка = слот блоку (A/B/X/Y = 1/2/3/4).
help.g13=Режим меню: правий стик — фокус, A вибір, Y закрити, X назад,
help.g14=   лівий стик рухає вікно (або скрол), L1/R1 вкладки, L2/R2 вікна.
help.g15=Спорядж.: наведи на надітий слот, A = зняти.
help.g16=Текст: екранна клавіатура (D-pad — навігація, A клавіша, OK введення).
help.g17=Діалог кількості: D-pad +/-, A ОК, Y скасувати.
help.g18=Start (Menu): відкрити/закрити меню ESC у будь-якому режимі.
help.g19=Back (View/Share): увімк./вимк. блокування камери (супровідна);
help.g20=   статус — Камера закр./вільна у рядку режимів.
help.g21=Вісь стика інвертована / надто швидкий поворот? ESC -> Налаштування геймпада.
help.g22=Вібрація: перемикачі за подіями в «Налаштування геймпада».
help.g23=Xbox / Steam Deck
help.g24=Лицьові A/B/X/Y; бампери LB/RB (L1/R1), тригери LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Cross/Circle/Square/Triangle = A/B/X/Y тут.
help.g27=Тачпад керує курсором у будь-якому режимі (клік = LMB).
help.g28=Nintendo Switch
help.g29=Лицьові B/A/Y/X відповідають A/B/X/Y тут; ZL/ZR = L2/R2.

