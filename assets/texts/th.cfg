help.g1=เปิดอัตโนมัติหากมีเกมแพดต่ออยู่ตอนเริ่มเกม มิฉะนั้นไปที่ การตั้งค่าทั่วไป ->
help.g2=ควบคุม: เกมแพด เมาส์และคีย์บอร์ดยังใช้งานได้
help.g3=D-pad: ขึ้น เมนู / ลง มอนสเตอร์ / ซ้าย NPC / ขวา ผู้เล่น
help.g4=   (กดแบบเดียวกันอีกครั้ง = มาตรฐาน)
help.g5=L3 โหมดเมาส์ (สติ๊กซ้าย = เคอร์เซอร์)  R3 โหมดกล้อง
help.g6=มาตรฐาน: สติ๊กซ้ายเคลื่อนที่ (หน้า=ทิศทาง, ซ้าย/ขวาเดินด้านข้าง),
help.g7=   สติ๊กขวาซ้าย/ขวาหมุนตัว, ขึ้น/ลงเอียงกล้อง
help.g8=   A โจมตีที่ใกล้ที่สุด  Y นั่ง  X โจมตีอัตโนมัติ  B เก็บของ
help.g9=โหมดเป้าหมาย: B ใกล้ที่สุด, สติ๊กขวาเลือกตามทิศทาง,
help.g10=   A ทำ (โจมตี / พูดคุย), X เมนูตามบริบท, Y ถัดไป/ล้าง
help.g11=ช่องด่วน: กด L2/R2 ค้างไว้ (แถว 1) หรือ L1/R1 (แถว 2) แล้วกด
help.g12=   ปุ่มหน้า = ช่องของบล็อกนั้น (A/B/X/Y = 1/2/3/4)
help.g13=โหมดเมนู: สติ๊กขวาเลื่อนโฟกัส, A เลือก, Y ปิด, X ย้อนกลับ,
help.g14=   สติ๊กซ้ายเลื่อนหน้าต่าง (หรือเลื่อนหน้าจอ), L1/R1 แท็บ, L2/R2 หน้าต่าง
help.g15=อุปกรณ์สวมใส่: โฟกัสช่องที่สวมอยู่, A = ถอดออก
help.g16=ข้อความ: คีย์บอร์ดบนหน้าจอ (D-pad เลื่อน, A เลือกตัวอักษร, OK ยืนยัน)
help.g17=หน้าต่างจำนวน: D-pad +/-, A ตกลง, Y ยกเลิก
help.g18=Start (Menu): เปิด/ปิดเมนู ESC ได้ทุกโหมด
help.g19=Back (View/Share): สลับเปิด/ปิด Camera Lock (กล้องตาม)
help.g20=   สถานะจะแสดงเป็น Cam Lock / Cam Free ในแถบโหมด
help.g21=แกนสติ๊กกลับด้าน / หมุนเร็วเกินไป? ไปที่ ESC -> ตั้งค่าเกมแพด
help.g22=การสั่น: ตั้งค่าการสั่นแยกตามเหตุการณ์ได้ในหน้าตั้งค่าเกมแพด
help.g23=Xbox / Steam Deck
help.g24=ปุ่มหน้า A/B/X/Y; ปุ่มบ่า LB/RB (L1/R1), LT/RT (L2/R2)
help.g25=PlayStation 4
help.g26=ปุ่มหน้า Cross/Circle/Square/Triangle = A/B/X/Y ในที่นี้
help.g27=ทัชแพดควบคุมเคอร์เซอร์ได้ทุกโหมด (คลิก = LMB)
