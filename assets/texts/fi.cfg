help.g1=Käynnistyy automaattisesti, jos ohjain on kytketty käynnistyksessä; muuten Yleiset ->
help.g2=Ohjaus: Peliohjain. Hiiri ja näppäimistö toimivat edelleen.
help.g3=D-pad: Ylös Valikko / Alas Hirviöt / Vasen NPC:t / Oikea Pelaajat
help.g4=   (paina samalla tavalla uudelleen = Vakio).
help.g5=L3 Hiiritila (vasen tikku = kohdistin)  R3 Kameratila
help.g6=Vakio: vasen tikku liikkuu (eteen=suunta, V/O sivuttain),
help.g7=   oikea tikku V/O kääntää, ylös/alas kallistaa kameraa.
help.g8=   A hyökkää lähimpään  Y istu  X automaattihyökkäys  B poimi
help.g9=Kohdistustilat: B lähin, oikea tikku valitsee suunnan mukaan,
help.g10=   A toimi (hyökkää / puhu), X pikavalikko, Y seuraava/tyhjennä.
help.g11=Pikavalikot: pidä L2/R2 (rivi 1) tai L1/R1 (rivi 2) pohjassa, sitten
help.g12=   painonappi = kyseisen lohkon paikka (A/B/X/Y = 1/2/3/4).
help.g13=Valikkotila: oikea tikku siirtää kohdistusta, A valitse, Y sulje, X takaisin,
help.g14=   vasen tikku siirtää ikkunaa (tai vieritä), L1/R1 välilehdet, L2/R2 ikkunat.
help.g15=Varusteet: kohdista puettuun paikkaan, A = riisu.
help.g16=Teksti: näppäimistö näytöllä (D-pad liikuttaa, A valitsee, OK vahvistaa).
help.g17=Määrän valinta: D-pad +/-, A OK, Y peruuta.
help.g18=Start (Valikko): avaa/sulje ESC-valikko missä tahansa tilassa.
help.g19=Back (View/Share): vaihtaa kameran lukituksen (seurantakamera) päälle/pois;
help.g20=   tila näkyy tilarivillä Kamera lukittu / Kamera vapaa.
help.g21=Tikun akseli väärinpäin / kääntyy liian nopeasti? ESC -> Peliohjaimen asetukset.
help.g22=Tärinä: tapahtumakohtaiset täräytykset Peliohjaimen asetuksissa.
help.g23=Xbox / Steam Deck
help.g24=Painikkeet A/B/X/Y; olkanapit LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Painikkeet Cross/Circle/Square/Triangle = A/B/X/Y tässä.
help.g27=Kosketuslevy ohjaa kohdistinta missä tahansa tilassa (napautus = LMB).
help.g28=Nintendo Switch
help.g29=Painikkeet B/A/Y/X vastaavat A/B/X/Y tässä; ZL/ZR = L2/R2.

