help.g1=تفعيل تلقائي إذا كانت يد التحكم موصولة عند التشغيل؛ وإلا الإعدادات العامة ->
help.g2=التحكم: يد التحكم. الفأرة ولوحة المفاتيح تظلان تعملان.
help.g3=D-pad: أعلى القائمة / أسفل الوحوش / يسار الشخصيات غير اللاعبة / يمين اللاعبين
help.g4=   (اضغط بنفس الطريقة مرة أخرى = وضع قياسي).
help.g5=L3 وضع الفأرة (العصا اليسرى = المؤشر)  R3 وضع الكاميرا
help.g6=قياسي: العصا اليسرى للحركة (للأمام=الاتجاه، يسار/يمين انزلاق جانبي)،
help.g7=   العصا اليمنى يسار/يمين للدوران، أعلى/أسفل لإمالة الكاميرا.
help.g8=   A هجوم على الأقرب  Y جلوس  X هجوم تلقائي  B التقاط
help.g9=أوضاع الاستهداف: B الأقرب، العصا اليمنى للاختيار حسب الاتجاه،
help.g10=   A تنفيذ (هجوم / حديث)، X قائمة السياق، Y التالي/إلغاء.
help.g11=الخانات السريعة: اضغط مطولاً L2/R2 (الصف 1) أو L1/R1 (الصف 2)، ثم
help.g12=   زر الوجه = خانة تلك المجموعة (A/B/X/Y = 1/2/3/4).
help.g13=وضع القائمة: العصا اليمنى لتحريك التركيز، A اختيار، Y إغلاق، X رجوع،
help.g14=   العصا اليسرى لتحريك النافذة (أو التمرير)، L1/R1 التبويبات، L2/R2 النوافذ.
help.g15=التجهيز: ركّز على خانة مرتداة، A = نزع.
help.g16=النص: لوحة مفاتيح على الشاشة (D-pad للتحريك، A للحرف، OK للإدخال).
help.g17=حوار الكمية: D-pad +/-، A موافق، Y إلغاء.
help.g18=Start (القائمة): فتح/إغلاق قائمة Esc في أي وضع.
help.g19=Back (View/Share): تبديل قفل الكاميرا (كاميرا المتابعة) تشغيل/إيقاف؛
help.g20=   تظهر الحالة كـ Cam Lock / Cam Free في شريط الوضع.
help.g21=محاور العصا معكوسة / الدوران سريع جدًا؟ Esc -> إعداد يد التحكم.
help.g22=الاهتزاز: تبديل الاهتزاز لكل حدث في إعداد يد التحكم.
help.g23=Xbox / Steam Deck
