help.k12=Alt+B    Skup towarów
help.k13=Alt+C    Pokój czatu
help.k14=Alt+X    Zwiń / rozwiń czat
help.k15=Alt+1..0 / Num 1..0   Sloty paska szybkiego
help.k16=Tab  Minimapa    Enter  Fokus czatu
help.k17=Esc  Menu / zamknij okno
help.k18=LMB  Chodzenie / atak    RMB  Obrót kamery
help.k19=Wheel  Zoom
help.k20=/sit /stand, /w <imię> <tekst>
help.g1=Auto-wł., jeśli pad jest podłączony przy starcie; w innym razie Ustawienia ogólne ->
help.g2=Sterowanie: Pad. Mysz i klawiatura nadal działają.
help.g3=D-pad: Góra Menu / Dół Potwory / Lewo NPC / Prawo Gracze
help.g4=   (naciśnięcie ponownie tak samo = Standardowy).
help.g5=L3 Tryb myszy (lewy drążek = kursor)  R3 Tryb kamery
help.g6=Standardowy: L-drążek ruch (przód=kierunek, L/R bok),
help.g7=   R-drążek obrót L/R, góra/dół pochylenie kamery.
help.g8=   A atak najbliższego  Y siadaj  X auto-atak  B podnieś
help.g9=Tryby celowania: B najbliższy, R-drążek wybór kierunkiem,
help.g10=   A akcja (atak / rozmowa), X menu kontekstowe, Y następny/wyczyść.
help.g11=Szybkie sloty: przytrzymaj L2/R2 (rząd 1) lub L1/R1 (rząd 2), a potem
help.g12=   przycisk = slot danego bloku (A/B/X/Y = 1/2/3/4).
help.g13=Tryb menu: R-drążek przesuwa fokus, A wybór, Y zamknij, X wstecz,
help.g14=   L-drążek przesuwa okno (lub przewija), L1/R1 karty, L2/R2 okna.
help.g15=Ekwipunek: ustaw fokus na założonym slocie, A = zdejmij.
help.g16=Tekst: klawiatura ekranowa (D-pad ruch, A klawisz, OK enter).
help.g17=Okno ilości: D-pad +/-, A OK, Y anuluj.
help.g18=Start (Menu): otwiera/zamyka menu ESC w każdym trybie.
help.g19=Back (View/Share): przełącza blokadę kamery (podążanie) wł./wył.;
help.g20=   status pokazywany jako Blokada kam. / Swobodna kam. na pasku trybu.
help.g21=Osie drążka odwrócone / obrót za szybki? ESC -> Ustawienia pada.
help.g22=Wibracje: przełączniki wibracji dla zdarzeń w Ustawieniach pada.
help.g23=Xbox / Steam Deck
help.g24=Przyciski A/B/X/Y; zderzaki LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Przyciski Cross/Circle/Square/Triangle = A/B/X/Y tutaj.
help.g27=Touchpad steruje kursorem w każdym trybie (klik = LMB).
help.g28=Nintendo Switch
help.g29=Przyciski B/A/Y/X odpowiadają A/B/X/Y tutaj; ZL/ZR = L2/R2.

