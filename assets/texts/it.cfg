help.g1=Auto-attivo se un pad è presente all'avvio; altrimenti Impostazioni Generali ->
help.g2=Controllo: Gamepad. Mouse e tastiera continuano a funzionare.
help.g3=D-pad: Su Menu / Giù Mostri / Sinistra NPC / Destra Giocatori
help.g4=   (premi di nuovo allo stesso modo = Standard).
help.g5=L3 Modalità mouse (levetta sinistra = cursore)  R3 Modalità camera
help.g6=Standard: levetta sinistra movimento (avanti=direzione, L/R strafe),
help.g7=   levetta destra L/R gira, U/D inclina camera.
help.g8=   A attacca il più vicino  Y siediti  X auto-attacco  B raccogli
help.g9=Modalità bersaglio: B più vicino, levetta destra scegli per direzione,
help.g10=   A agisci (attacca / parla), X menu contestuale, Y successivo/pulisci.
help.g11=Slot rapidi: tieni premuto L2/R2 (riga 1) o L1/R1 (riga 2), poi un
help.g12=   tasto frontale = slot di quel blocco (A/B/X/Y = 1/2/3/4).
help.g13=Modalità menu: levetta destra sposta il focus, A seleziona, Y chiudi, X indietro,
help.g14=   levetta sinistra sposta finestra (o scorri), L1/R1 schede, L2/R2 finestre.
help.g15=Equipaggiamento: metti a fuoco uno slot indossato, A = togli.
help.g16=Testo: tastiera a schermo (D-pad muovi, A tasto, OK invio).
help.g17=Finestra quantità: D-pad +/-, A OK, Y annulla.
help.g18=Start (Menu): apri/chiudi il menu ESC in qualsiasi modalità.
help.g19=Back (View/Share): attiva/disattiva il Blocco Camera (segui-camera);
help.g20=   lo stato appare come Cam Bloccata / Cam Libera nella barra modalità.
help.g21=Asse levetta invertito / gira troppo veloce? ESC -> Config. GamePad.
help.g22=Vibrazione: interruttori per evento in Config. GamePad.
help.g23=Xbox / Steam Deck
help.g24=Tasti A/B/X/Y; dorsali LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Tasti Cross/Circle/Square/Triangle = A/B/X/Y qui.
help.g27=Il touchpad guida il cursore in qualsiasi modalità (click = LMB).
help.g28=Nintendo Switch
help.g29=Tasti B/A/Y/X corrispondono ad A/B/X/Y qui; ZL/ZR = L2/R2.

