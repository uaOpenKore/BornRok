help.g1=Auto-zapnutí, pokud je při spuštění připojen gamepad; jinak Obecné nastavení ->
help.g2=Ovládání: Gamepad. Myš a klávesnice fungují nadále.
help.g3=D-pad: Nahoru Nabídka / Dolů Příšery / Vlevo NPC / Vpravo Hráči
help.g4=   (stiskněte stejným způsobem znovu = Standardní).
help.g5=L3 Režim myši (levá páčka = kurzor)  R3 Režim kamery
help.g6=Standardní: L-páčka pohyb (vpřed=směr pohledu, L/R úkrok),
help.g7=   R-páčka L/R otáčení, U/D náklon kamery.
help.g8=   A útok na nejbližšího  Y sednout  X auto-útok  B zvednout
help.g9=Režimy cíle: B nejbližší, R-páčka výběr podle směru,
help.g10=   A jednat (útok / mluvit), X kontextová nabídka, Y další/zrušit.
help.g11=Rychlé sloty: podržte L2/R2 (řada 1) nebo L1/R1 (řada 2), poté
help.g12=   tlačítko = slot daného bloku (A/B/X/Y = 1/2/3/4).
help.g13=Režim nabídky: R-páčka pohyb kurzoru, A vybrat, Y zavřít, X zpět,
help.g14=   L-páčka posun okna (nebo scroll), L1/R1 karty, L2/R2 okna.
help.g15=Vybavení: zaměřte nasazený slot, A = sundat.
help.g16=Text: klávesnice na obrazovce (D-pad pohyb, A klávesa, OK potvrdit).
help.g17=Dialog množství: D-pad +/-, A OK, Y zrušit.
help.g18=Start (Nabídka): otevře/zavře ESC nabídku v jakémkoli režimu.
help.g19=Back (View/Share): přepíná uzamčení kamery (sledovací kamera) zap/vyp;
help.g20=   stav se zobrazuje jako Kamera zamčena / Kamera volná v liště režimu.
help.g21=Osy páček obrácené / otáčení příliš rychlé? ESC -> Nastavení gamepadu.
help.g22=Vibrace: přepínače vibrací pro jednotlivé události v Nastavení gamepadu.
help.g23=Xbox / Steam Deck
help.g24=Tlačítka A/B/X/Y; ramenní LB/RB (L1/R1), LT/RT (L2/R2).
help.g25=PlayStation 4
help.g26=Tlačítka Cross/Circle/Square/Triangle = zde A/B/X/Y.
help.g27=Touchpad ovládá kurzor v jakémkoli režimu (klik = LMB).
help.g28=Nintendo Switch
help.g29=Tlačítka B/A/Y/X odpovídají zde A/B/X/Y; ZL/ZR = L2/R2.

